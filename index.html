<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문에 신중히 답하세요</title>
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden; 
        }

        #content-box {
            text-align: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            max-width: 700px;
            padding: 20px;
            z-index: 10;
        }

        .visible {
            opacity: 1 !important;
        }

        .question-text {
            font-size: 22px;
            margin-bottom: 40px;
            line-height: 1.8;
            word-break: keep-all; 
        }

        .button-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transition: opacity 1.2s ease-in-out 0.6s;
        }

        .action-btn {
            background: none;
            border: 1px solid #444;
            color: #bbb;
            padding: 16px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.4s;
            border-radius: 4px;
        }

        .action-btn:hover {
            background-color: white;
            color: black;
            border-color: white;
        }

        #nav-box {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 30px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none; 
        }

        #nav-box.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #555; 
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="content-box">
        <div id="text-area" class="question-text"></div>
        <div id="button-area" class="button-box"></div>
    </div>

    <div id="nav-box">
        <button id="btn-back" class="nav-btn">◀ 이전 질문</button>
        <button id="btn-restart" class="nav-btn">↻ 처음으로</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getCountFromServer, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAi_3S71UOFS2SWkZdDeUvqiFsj9S8EGx4",
            authDomain: "life-5f121.firebaseapp.com",
            projectId: "life-5f121",
            storageBucket: "life-5f121.firebasestorage.app",
            messagingSenderId: "877531197596",
            appId: "1:877531197596:web:06e45184b62ce2d0e9fd59",
            measurementId: "G-9N2S0KZ1EK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const questions = [
            { type: "intro", text: "질문에 신중히 답하세요." },
            { text: "Q1. 당신의 삶은 행복합니까?", options: ["예", "아니오"] },
            { text: "Q2. 그럼 당신이 불행한 가장 큰 이유는 무엇입니까?", options: ["극복하기 힘든 현실적인 벽과 경제적인 문제들 때문입니다.", "경제적인 문제도 있지만 사람과의 관계가 날 더 힘들게 합니다."] },
            { text: "Q3. 지금 당신의 불행 중, 당신 스스로 통제하거나 바꿀 수 있는 부분이 조금이라도 남아있습니까?", options: ["네, 아주 작더라도 내가 선택하고 바꿀 수 있는 부분은 있습니다.", "아니오, 거대한 파도에 휩쓸리듯 나에게는 아무런 통제권이 없는거 같습니다."] },
            { text: "Q4. 견디기 힘든 고통이나 스트레스가 찾아올 때, 당신의 마음은 어떻게 반응합니까?", options: ["차라리 아무 생각도 하지 않으려 감정을 억누르고 외면합니다.", "왜 이런 일이 생겼는지 그 이유를 끊임없이 곱씹으며 스스로를 괴롭힙니다."] },
            { text: "Q5. 아무것도 이뤄내지 못한, 그저 숨만 쉬고 있는 당신 자신도 가치가 있다고 생각하십니까?", options: ["네, 나의 존재 자체만으로도 의미가 있다고 믿고 싶습니다.", "아니오, 쓸모를 증명하지 못하는 나는 아무런 가치가 없습니다."] },
            { text: "Q6. '책임감'이라는 단어를 떠올렸을 때, 당신의 첫 기분은 어떻습니까?", options: ["나를 어떻게든 살아가게 만드는 최소한의 원동력입니다.", "나를 짓누르고 숨 막히게 하는 무거운 족쇄입니다."] },
            { text: "Q7. 가족이라는 이름은 당신에게 어떤 의미입니까?", options: ["상처받은 내가 돌아갈 수 있는 유일한 안식처.", "끊임없이 나의 희생을 요구하는 벗어날 수 없는 의무."] },
            { text: "Q8. 누군가를 부양하거나 책임져야 한다는 압박감에 모든 것을 버리고 도망치고 싶었던 적이 있습니까?", options: ["가끔 버겁지만, 결국 내가 감당해야 할 몫이라 생각합니다.", "네, 모든 것을 다 버려두고 흔적 없이 사라지고 싶었던 적이 있습니다."] },
            { text: "Q9. 당신은 온전히 '나 자신'만을 위해 하루를 써본 지 얼마나 되었습니까?", options: ["가끔은 어떻게든 나를 위해 시간을 내려고 노력합니다.", "대부분의 시간을 남을 위해 쓰는것 같습니다."] },
            { text: "Q10. 사랑하는 사람(연인이나 배우자)은 현재 당신에게 어떤 존재입니까?", options: ["서로의 상처를 보듬어주는 고마운 동반자입니다.", "사랑하지만 때로는 서로를 지치게 만드는 또 다른 상처입니다."] },
            { text: "Q11. 가장 가까운 사람에게 당신의 가장 어둡고 처참한 밑바닥을 솔직하게 털어놓을 수 있습니까?", options: ["네, 나의 못난 모습도 결국 안아주고 이해해 줄 것입니다.", "아니오, 말해봤자 소용없거나 상대에게 짐만 될 뿐입니다."] },
            { text: "Q12. 다른 사람들의 평범하고 행복한 일상을 볼 때, 당신은 어떤 기분이 듭니까?", options: ["처참한 내 현실과 뼈저리게 비교되어 깊은 박탈감이 듭니다.", "이제는 나와 완전히 다른 세상 이야기 같아 그저 무감각합니다."] },
            { text: "Q13. 당신의 불행은 결국 타인과 세상의 탓입니까, 아니면 당신의 선택 때문입니까?", options: ["나의 잘못 보다는 사회적인 환경의 탓이 큽니다.", "생각해보면 결국은 내 선택 탓입니다."] },
            { text: "Q14. 매일 반복되는 쳇바퀴 같은 일상 속에서 당신은 어떤 생각을 하십니까?", options: ["언젠가는 이 터널도 끝날 거란 아주 작은 희망으로 버팁니다.", "그저 멈출 수 없기에 기계처럼 숨을 쉬며 오늘 하루를 견뎌낼 뿐입니다."] },
            { text: "Q15. 당신을 가장 옥죄는 감정은 무엇입니까?", options: ["당장 내일 어떻게 살아야 할지 막막한 '미래의 불안'.", "그때 그러지 말았어야 했다는 돌이킬 수 없는 '과거의 후회'."] },
            { text: "Q16. 당신을 짓누르는 모든 짐과 의무가 기적처럼 사라진다면 당신은 행복해질까요?", options: ["네, 마침내 숨통이 트이고 자유롭게 내 삶을 살 수 있을 것 같습니다.", "아니오, 결국 훌훌 털어버리고 맘편히 떠날꺼 같습니다."] },
            { text: "Q17. 최근에 아무도 모르게, 소리 없이 혼자 울어본 적이 있습니까?", options: ["네, 가끔은 목끝까지 차오르는 감정을 도저히 주체할 수 없습니다.", "아니오, 너무 오랜 시간 참다 보니 이제는 눈물조차 완전히 메말라 버렸습니다."] },
            { text: "Q18. 당신에게 삶을 포기하지 않게 만드는 아주 작은 불씨라도 남아있습니까?", options: ["언젠가 나에게도 찾아올 성공이나 보상에 대한 미련.", "나를 지켜보는 누군가, 혹은 차마 버리지 못한 알량한 책임감."] },
            { text: "Q19. 기적이 일어나 단 하나의 소원이 이루어진다면 무엇을 원합니까?", options: ["내 과거의 모든 기억을 지우고 완전히 처음부터 다시 시작할 기회.", "지금 너덜너덜해진 나를 아무 조건 없이 따뜻하게 안아줄 수 있는 평온."] },
            { text: "Q20. 마지막 질문입니다. 그럼에도 불구하고, 당신은 다시 행복해질 수 있다고 믿습니까?", options: ["네, 아직은 완벽히 포기하지 않았습니다.", "잘 모르겠습니다. 지금은 그저 모든 것을 내려놓고 싶습니다."] }
        ];

        let currentIndex = 0; 
        let userAnswers = ""; 
        const footerNote = "\n\n저는 상담가가 아닙니다. 질문을 던지는 사람일뿐입니다. 같은 선택의 사람들이 있다는 위로로 힘내드시길 바랍니다.";

        const contentBox = document.getElementById('content-box');
        const textArea = document.getElementById('text-area');
        const buttonArea = document.getElementById('button-area');
        const navBox = document.getElementById('nav-box');

        document.getElementById('btn-back').addEventListener('click', goBack);
        document.getElementById('btn-restart').addEventListener('click', restart);

        function showScreen() {
            const currentData = questions[currentIndex];
            textArea.innerText = currentData.text;
            buttonArea.innerHTML = ""; 
            buttonArea.classList.remove('visible'); 

            if (currentIndex > 1 && currentIndex < questions.length) {
                navBox.classList.add('visible');
            } else {
                navBox.classList.remove('visible');
            }

            if (currentData.type !== "intro") {
                currentData.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = "action-btn";
                    btn.innerText = option;
                    const answerValue = index === 0 ? "A" : "B"; 
                    btn.addEventListener('click', () => handleAnswer(answerValue));
                    buttonArea.appendChild(btn);
                });
            }

            setTimeout(() => {
                contentBox.classList.add('visible');
                if (currentData.type !== "intro") {
                    buttonArea.classList.add('visible');
                }
            }, 50); 

            if (currentData.type === "intro") {
                setTimeout(() => { fadeAndNext(); }, 3000); 
            }
        }

        async function handleAnswer(answer) {
            const answersRef = collection(db, "user_choices");

            if (currentIndex === 1) {
                navBox.classList.remove('visible');
                contentBox.classList.remove('visible');

                if (answer === "A") { 
                    showResultText("잠시만 기다려주세요...");
                    try {
                        await addDoc(answersRef, { choices: "YES_HAPPY", timestamp: new Date() });
                        const totalSnapshot = await getCountFromServer(answersRef);
                        const totalCount = totalSnapshot.data().count;
                        const happyQuery = query(answersRef, where("choices", "==", "YES_HAPPY"));
                        const happySnapshot = await getCountFromServer(happyQuery);
                        const happyCount = happySnapshot.data().count;
                        const percent = totalCount > 0 ? ((happyCount / totalCount) * 100).toFixed(1) : 100.0;

                        setTimeout(() => {
                            showResultText(`축하합니다. 당신의 삶은 축복받았네요.\n당신은 더 이상 이 질문에 답을 하실 필요가 없습니다.\n\n[ 전체 참여자 ${totalCount.toLocaleString()}명 중 ${happyCount.toLocaleString()}명(약 ${percent}%)이\n당신과 같이 '예'를 선택했습니다. ]` + footerNote);
                        }, 1000);
                    } catch (e) {
                        showResultText("축하합니다. 당신의 삶은 축복받았네요.\n당신은 더 이상 이 질문에 답을 하실 필요가 없습니다." + footerNote);
                    }
                    return; 
                } else { 
                    userAnswers += answer;
                    try {
                        const totalSnapshot = await getCountFromServer(answersRef);
                        const dbTotalCount = totalSnapshot.data().count;
                        const happyQuery = query(answersRef, where("choices", "==", "YES_HAPPY"));
                        const happySnapshot = await getCountFromServer(happyQuery);
                        const happyCount = happySnapshot.data().count;
                        const realTotal = dbTotalCount + 1; 
                        const dbNoCount = dbTotalCount - happyCount;
                        const realNo = dbNoCount + 1;
                        const percent = ((realNo / realTotal) * 100).toFixed(1);

                        setTimeout(() => {
                            if (realTotal === 1) {
                                showTransitionText("당신이 이 어두운 길을 걷기 시작한\n첫 번째 사람입니다.");
                            } else {
                                showTransitionText(`전체 참여자 ${realTotal.toLocaleString()}명 중 ${realNo.toLocaleString()}명(약 ${percent}%)이\n당신과 같은 궤적을 걷기 시작했습니다.`);
                            }
                        }, 1000);
                    } catch (e) {
                        showTransitionText("당신과 같은 궤적을 걷기 시작했습니다.");
                    }
                    return;
                }
            }

            userAnswers += answer;

            if (currentIndex === questions.length - 1) {
                navBox.classList.remove('visible');
                showResultText("잠시만 기다려주세요...\n당신과 같은 길을 걸어온 사람들을 찾고 있습니다.");
                try {
                    await addDoc(answersRef, { choices: userAnswers, timestamp: new Date() });
                    const totalSnapshot = await getCountFromServer(answersRef);
                    const totalCount = totalSnapshot.data().count;
                    const matchQuery = query(answersRef, where("choices", "==", userAnswers));
                    const matchSnapshot = await getCountFromServer(matchQuery);
                    const matchCount = matchSnapshot.data().count;
                    const percent = totalCount > 0 ? ((matchCount / totalCount) * 100).toFixed(2) : 100.00;
                    
                    setTimeout(() => {
                        contentBox.classList.remove('visible');
                        setTimeout(() => {
                            if (totalCount === 1) {
                                textArea.innerText = `수고하셨습니다.\n이 길의 끝에 도달한 사람은 당신이 처음입니다.\n\n이 화면을 닫으면, 다시 당신의 삶으로 돌아갑니다.` + footerNote;
                            } else {
                                textArea.innerText = `수고하셨습니다.\n당신과 완전히 똑같은 20개의 선택을 한 사람은\n전체 참여자 ${totalCount.toLocaleString()}명 중 ${matchCount.toLocaleString()}명 (약 ${percent}%) 입니다.\n\n이 화면을 닫으면, 다시 당신의 삶으로 돌아갑니다.` + footerNote;
                            }
                            contentBox.classList.add('visible');
                        }, 1200);
                    }, 2500);
                } catch (error) {
                    showResultText("데이터를 불러오는 중 문제가 발생했습니다.");
                }
            } else {
                fadeAndNext();
            }
        }

        function showTransitionText(text) {
            navBox.classList.remove('visible');
            contentBox.classList.remove('visible');
            setTimeout(() => {
                textArea.innerText = text;
                buttonArea.innerHTML = "";
                contentBox.classList.add('visible');
                setTimeout(() => { fadeAndNext(); }, 3000); 
            }, 50); 
        }

        function showResultText(text) {
            navBox.classList.remove('visible');
            contentBox.classList.remove('visible');
            setTimeout(() => {
                textArea.innerText = text;
                buttonArea.innerHTML = "";
                contentBox.classList.add('visible');
            }, 50); 
        }

        function fadeAndNext() {
            contentBox.classList.remove('visible'); 
            setTimeout(() => {
                currentIndex++; 
                showScreen(); 
            }, 1200); 
        }

        function goBack() {
            if (currentIndex > 1) { 
                contentBox.classList.remove('visible');
                setTimeout(() => {
                    currentIndex--; 
                    userAnswers = userAnswers.slice(0, -1); 
                    showScreen();
                }, 800); 
            }
        }

        function restart() {
            contentBox.classList.remove('visible');
            navBox.classList.remove('visible');
            setTimeout(() => {
                currentIndex = 0;
                userAnswers = "";
                showScreen();
            }, 1200); 
        }

        setTimeout(showScreen, 300); 
    </script>
</body>
</html>
